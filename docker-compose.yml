version: '3.8'

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: philo_php
    environment:
      - PHP_OUTPUT_BUFFERING=4096
    volumes:
      - .:/var/www/html
    networks:
      - philo_net
    depends_on:
      - database

  nginx:
    image: nginx:alpine
    container_name: philo_nginx
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - philo_net
    depends_on:
      - php

  database:
    image: mysql:8.0
    container_name: philo_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: philostudio
      MYSQL_USER: philo_user
      MYSQL_PASSWORD: philo_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - philo_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: philo_phpmyadmin
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    networks:
      - philo_net
    depends_on:
      - database

networks:
  philo_net:
    driver: bridge

volumes:
  db_data: