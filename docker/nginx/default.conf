server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    # Legacy PHP entry points from the pre-Symfony application.
    # Keep old bookmarks and external links working.
    location = /philostudio.php      { return 301 /; }
    location = /about.php            { return 301 /about; }
    location = /contact.php          { return 301 /contact; }
    location = /faq.php              { return 301 /faq; }
    location = /gallery.php          { return 301 /gallery; }
    location = /packages.php         { return 301 /packages; }
    location = /login.php            { return 301 /login; }
    location = /register.php         { return 301 /register; }
    location = /dashboard.php        { return 301 /dashboard; }
    location = /booking.php          { return 301 /booking; }
    location = /booking_step2.php    { return 301 /booking/date; }
    location = /booking_step3.php    { return 301 /booking/customize; }
    location = /booking_step4.php    { return 301 /booking/review; }
    location = /get_booked_slots.php { return 301 /get-booked-slots; }
    location = /admin/login.php            { return 301 /admin/login; }
    location = /admin/logout.php           { return 301 /admin/logout; }
    location = /admin/dashboard.php        { return 301 /admin/dashboard; }
    location = /admin/blockout_manage.php  { return 301 /admin/blockouts; }
    location = /admin/packages_manage.php  { return 301 /admin/packages; }
    location = /admin/customers.php        { return 301 /admin/customers; }
    location = /admin/daily_schedule.php   { return 301 /admin/daily-schedule; }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Preserve reverse-proxy info (ngrok, Cloudflare Tunnel, etc.)
        fastcgi_param HTTP_X_FORWARDED_FOR   $http_x_forwarded_for   if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_HOST  $http_x_forwarded_host  if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PORT  $http_x_forwarded_port  if_not_empty;
    }
}
