; Performance tuning for development on a Windows bind mount.
;
; The project is bind-mounted from C:\ into the Linux container, so every
; filesystem stat is expensive. OPcache is enabled, but with the default
; "validate_timestamps" setting PHP re-stats hundreds of PHP files on most
; requests. That is the main reason page switches take several seconds.
;
; Set validate_timestamps=0 for maximum speed, but then run
; `docker restart philo_php` after editing PHP.
;
; Do NOT add opcache.preload here. Preloading the Symfony dev container reads
; hundreds of PHP files over the slow bind mount before PHP-FPM binds its
; socket, which makes the site return 502 for ~30 seconds after every start.
; The small per-request gain is not worth that startup stall.
opcache.validate_timestamps=0
opcache.revalidate_freq=0

; Keep the compiled bytecode cache large enough for the full dev class set.
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; Larger realpath cache reduces repeated path resolution on the bind mount.
realpath_cache_size=16M
realpath_cache_ttl=600
